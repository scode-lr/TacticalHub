<div class="menu-container">
  <!-- Desktop Role Selector -->
  <app-role-selector [currentRole]="currentRole()" class="desktop-only" ></app-role-selector>

  <!-- Desktop Menu Nav -->
  <nav class="menu-nav">
    @for (item of menuItemsWithBadges(); track item.id) {
      <button
        class="menu-item"
        [class.active]="isSelected(item.id)"
        (click)="selectMenuItem(item)">
        <ion-icon [name]="item.icon" class="menu-icon"></ion-icon>
        <span class="menu-label">{{ item.label | translate }}</span>
        @if (item.badge && item.badge > 0) {
          <span class="menu-badge"></span>
        }
      </button>
    }

    @if (moreItemsWithBadges().length > 0) {
      <div class="menu-divider"></div>

      @for (item of moreItemsWithBadges(); track item.id) {
        <button
          class="menu-item"
          [class.active]="isSelected(item.id)"
          (click)="selectMenuItem(item)">
          <ion-icon [name]="item.icon" class="menu-icon"></ion-icon>
          <span class="menu-label">{{ item.label | translate }}</span>
          @if (item.badge && item.badge > 0) {
            <span class="menu-badge"></span>
          }
        </button>
      }
    }
  </nav>

  <!-- Desktop User Section -->
  <div class="user-section desktop-only">
    <button
      type="button"
      class="user-info"
      (click)="goToProfile()"
      [attr.aria-label]="'common.profile' | translate">
      <img [src]="avatarUrl()" [alt]="user()?.username" (error)="onAvatarError()" class="user-avatar">
    </button>
    <div class="action-buttons">
      <button class="settings-button" (click)="goToSettings()">
        <ion-icon name="settings-outline"></ion-icon>
      </button>
      <button class="logout-button" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Nav -->
  <nav class="menu-nav-mobile">
    @for (item of mobileMenuItemsWithBadges(); track item.id) {
      <button
        class="menu-item"
        [class.active]="isSelected(item.id) && !isMoreActive()"
        (click)="selectMenuItem(item)">
        <div class="menu-icon-wrapper">
          <ion-icon [name]="item.icon" class="menu-icon"></ion-icon>
          @if (item.badge && item.badge > 0) {
            <span class="menu-badge-mobile"></span>
          }
        </div>
        <span class="menu-label">{{ item.label | translate }}</span>
      </button>
    }

    @if (moreItems().length > 0) {
      <button
        class="menu-item menu-more"
        [class.active]="isMoreActive()"
        (click)="goToMore()">
        <div class="menu-icon-wrapper">
          <ion-icon name="apps-outline" class="menu-icon"></ion-icon>
        </div>
        <span class="menu-label">{{ 'user.menu.more' | translate }}</span>
      </button>
    }
  </nav>
</div>
