<article
  class="news-card"
  [class.news-card--featured]="variant() === 'featured'"
  [class.news-card--row]="variant() === 'row'"
  [style.animation-delay]="animationDelay() * 0.04 + 's'"
  (click)="onCardClick()">
  <div class="news-thumb" [class.news-thumb--empty]="!primaryImageUrl" [style.background-image]="primaryImageUrl ? 'url(' + primaryImageUrl + ')' : null">
    @if (!primaryImageUrl) {
      <ion-icon name="newspaper-outline"></ion-icon>
    }
  </div>

  <div class="news-body">
    <span class="news-time">{{ getTimeAgo(news().publishedAt || news().createdAt) }}</span>

    @if (variant() === 'featured') {
      <h2 class="news-title">{{ news().title }}</h2>
    } @else {
      <h3 class="news-title">{{ news().title }}</h3>
    }

    <p class="news-excerpt">{{ bodyExcerpt }}</p>
  </div>
</article>
