<div class="page-header">
  <div class="header-content group-container">
    <div class="header-leading">
      @if (showBackButton()) {
        <button class="back-button-icon" (click)="goBack()" [attr.aria-label]="'common.back' | translate">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </button>
      } @else {
        <button
          type="button"
          class="header-home-button"
          (click)="goToHome()"
          [attr.aria-label]="'user.menu.home' | translate">
          <img
            class="header-club-logo"
            [src]="defaultClubLogo()"
            [alt]="currentRole()?.clubName || 'Club'"
            appDefaultImage="assets/image-non-available.svg">
        </button>
      }
    </div>

    @if (showBackButton() && title(); as pageTitle) {
      <h1 class="header-title">{{ pageTitle | translate }}</h1>
    }

    <div class="header-actions">
      @if (showNotificationsButton()) {
        <button class="header-action-button" type="button" (click)="goToNotifications()" [attr.aria-label]="'user.menu.notifications' | translate">
          <ion-icon name="notifications-outline"></ion-icon>
          @if (notificationsBadge() > 0) {
            <span class="notifications-badge">{{ notificationsBadge() }}</span>
          }
        </button>
      }
    </div>
  </div>
</div>
