<div class="strength">
  <span [style.background]="barColor(1)"></span>
  <span [style.background]="barColor(2)"></span>
  <span [style.background]="barColor(3)"></span>
  <span [style.background]="barColor(4)"></span>
</div>
@if (labelKey(); as key) {
  <span class="strength-label" [style.color]="labelColor()">{{ key | translate }}</span>
}

<div class="checklist">
  <div class="check-row" [class.ok]="lenOk()">
    <span class="check-icon">{{ lenOk() ? '✓' : '○' }}</span>{{ 'auth.passwordHint6Chars' | translate }}
  </div>
  <div class="check-row" [class.ok]="upperOk()">
    <span class="check-icon">{{ upperOk() ? '✓' : '○' }}</span>{{ 'auth.passwordHintUppercase' | translate }}
  </div>
  <div class="check-row" [class.ok]="numOk()">
    <span class="check-icon">{{ numOk() ? '✓' : '○' }}</span>{{ 'auth.passwordHintNumber' | translate }}
  </div>
</div>
