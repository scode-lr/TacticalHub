@if (!isAddCard()) {
  <app-list-card
    [avatarSrc]="role()?.clubLogo ?? null"
    [icon]="'shield-outline'"
    [title]="role()?.clubName ?? ''"
    [subtitleIcon]="getRoleIcon(role()?.roleId)"
    [subtitle]="getRoleDisplayName(role())"
    [badgeText]="isPending() ? ('roleSelection.pending' | translate) : null"
    [disabled]="isPending()"
    [showArrow]="!isPending()"
    [listMode]="listMode()"
    [selected]="selected()"
    (cardClicked)="onCardClick()"
  />
} @else {
  <div class="club-card add-club-card" (click)="onCardClick()">
    <div class="add-club-content">
      <div class="add-icon">
        <ion-icon name="add"></ion-icon>
      </div>
      <h3>{{ 'roleSelection.addNewTeam' | translate }}</h3>
      <p>{{ 'roleSelection.joinOrCreate' | translate }}</p>
    </div>
  </div>
}
