<div class="mobile-page-header">
  <app-user-header [showBackButton]="true" [title]="pageTitle()" />
</div>

<div class="page-container">
  <div class="section-header-with-back-button">
    <app-back-button />
    <h1 class="section-title">{{ pageTitle() | translate }}</h1>
  </div>

  @if (isLoading()) {
    <div class="loading-state"></div>
  }

  @if (!isLoading()) {
  <form [formGroup]="form" class="detail-form">

    <div class="form-card">
      <div class="form-card-header">
        <h2 class="card-section-title">{{ 'admin.settingsForms.section.general' | translate }}</h2>
      </div>
      <div class="form-card-body">

        <div class="form-field">
          <label for="name">{{ 'admin.settingsForms.fields.name' | translate }} <span class="required-mark">*</span></label>
          <input
            id="name"
            class="form-input"
            formControlName="name"
            [placeholder]="'admin.settingsForms.fields.namePlaceholder' | translate"
          />
          @if (ctrl.name.invalid && ctrl.name.touched) {
            <small class="field-error">{{ 'admin.settingsForms.fields.nameRequired' | translate }}</small>
          }
        </div>

        <div class="form-field">
          <label for="description">{{ 'admin.settingsForms.fields.description' | translate }}</label>
          <textarea
            id="description"
            class="form-textarea"
            formControlName="description"
            rows="3"
            [placeholder]="'admin.settingsForms.fields.descriptionPlaceholder' | translate"
          ></textarea>
        </div>

        <div class="field-row">
          <div class="form-field">
            <label for="fromDate">{{ 'admin.settingsForms.fields.fromDate' | translate }}</label>
            <input
              id="fromDate"
              class="form-input form-date"
              type="date"
              formControlName="fromDate"
            />
          </div>
          <div class="form-field">
            <label for="toDate">{{ 'admin.settingsForms.fields.toDate' | translate }}</label>
            <input
              id="toDate"
              class="form-input form-date"
              type="date"
              formControlName="toDate"
            />
          </div>
        </div>

        <div class="field-row">
          <div class="form-field">
            <label for="status">{{ 'admin.settingsForms.fields.status' | translate }} <span class="required-mark">*</span></label>
            <select
              id="status"
              class="form-select"
              formControlName="status"
            >
              @for (item of statusItems; track item.value) {
                <option [value]="item.value">{{ item.label }}</option>
              }
            </select>
          </div>
          <div class="form-field">
            <label>{{ 'admin.settingsForms.type' | translate }}</label>
            <div class="field-readonly">
              <ion-icon [name]="typeIcon()"></ion-icon>
              <span>{{ typeLabelKey() | translate }}</span>
            </div>
          </div>
        </div>

        <div class="form-toggles">
          <label class="form-toggle">
            <input type="checkbox" formControlName="requiresSignature" />
            <span class="form-toggle-text">
              <span class="form-toggle-title">{{ 'admin.settingsForms.fields.requiresSignature' | translate }}</span>
              <span class="form-toggle-desc">{{ 'admin.settingsForms.fields.requiresSignatureDescription' | translate }}</span>
            </span>
          </label>

          <label class="form-toggle">
            <input type="checkbox" formControlName="generatesDocument" />
            <span class="form-toggle-text">
              <span class="form-toggle-title">{{ 'admin.settingsForms.fields.generatesDocument' | translate }}</span>
              <span class="form-toggle-desc">
                {{ (ctrl.requiresSignature.value
                      ? 'admin.settingsForms.fields.generatesDocumentLocked'
                      : 'admin.settingsForms.fields.generatesDocumentDescription') | translate }}
              </span>
            </span>
          </label>

          <label class="form-toggle">
            <input type="checkbox" formControlName="requiresReview" />
            <span class="form-toggle-text">
              <span class="form-toggle-title">{{ 'admin.settingsForms.fields.requiresReview' | translate }}</span>
              <span class="form-toggle-desc">{{ 'admin.settingsForms.fields.requiresReviewDescription' | translate }}</span>
            </span>
          </label>

          <label class="form-toggle">
            <input type="checkbox" formControlName="adultsOnly" />
            <span class="form-toggle-text">
              <span class="form-toggle-title">{{ 'admin.settingsForms.fields.adultsOnly' | translate }}</span>
              <span class="form-toggle-desc">{{ 'admin.settingsForms.fields.adultsOnlyDescription' | translate }}</span>
            </span>
          </label>
        </div>

      </div>
    </div>

    <app-settings-form-fields [fields]="fieldsArray" />

    <app-section-footer-actions
      [canCancel]="true"
      [canPreview]="true"
      [canSave]="!isSaving()"
      [previewLabel]="'admin.settingsForms.preview.button'"
      (cancelAction)="goBack()"
      (previewAction)="openPreview()"
      (saveAction)="onSubmit()" />

  </form>

  <app-preview-modal
    [isOpen]="previewOpen()"
    [title]="'admin.settingsForms.preview.title'"
    [subtitle]="form.get('name')?.value ?? ''"
    [notice]="'admin.settingsForms.preview.notice'"
    [emptyMessage]="'admin.settingsForms.preview.noFields'"
    [isEmpty]="previewFields.length === 0"
    (didDismiss)="previewOpen.set(false)">
    <app-form-preview-content [fields]="previewFields" />
  </app-preview-modal>
  }
</div>

<ion-toast
  [isOpen]="showToast()"
  [message]="toastMessage()"
  [color]="toastColor()"
  duration="3000"
  position="top"
  (didDismiss)="onToastDismiss()">
</ion-toast>
