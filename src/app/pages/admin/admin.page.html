<ion-content [scrollY]="false">
  <div class="admin-page">
    <div class="mobile-header">
      <app-user-header 
        [showBackButton]="showBackButton()"
        [showRoleSelector]="!showBackButton()"
        [currentRole]="currentRole()"
        [backUrl]="backUrl()"
        (backClick)="goBack()">
      </app-user-header>
    </div>

    <div class="layout-container">
      <app-menu [config]="adminMenuConfig" [currentRole]="currentRole()" [class.hidden-on-detail]="isDetailPage()"></app-menu>
      
      <div class="content-container" [class.full-width]="isDetailPage()">
        <ion-router-outlet></ion-router-outlet>
      </div>
    </div>
  </div>
</ion-content>
