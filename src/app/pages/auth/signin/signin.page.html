<div class="signin-page auth-page">
  <!-- Back Button (Mobile Only) -->
  <button class="btn-icon back-btn" (click)="goBack()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
  </button>

  <div class="branding-section">
    <app-auth-branding></app-auth-branding>
  </div>
  <!-- Right Side - Form -->
  <div class="form-section">
    <div class="form-container">
      <div class="form-header">
        <h1>{{ 'welcome.signIn' | translate }}</h1>
        <p>{{ 'auth.signInSubtitle' | translate }}</p>
      </div>
      <form [formGroup]="signinForm" (ngSubmit)="onSignIn()" class="signin-form">
        <!-- Email Input -->
        <div class="input-group">
          <ion-input 
            type="email" 
            formControlName="email"
            [placeholder]="'auth.email' | translate"
            fill="outline"
            class="modern-input"
            [class.ion-invalid]="signinForm.get('email')?.invalid && formSubmitted()">
          </ion-input>
          @if (emailError(); as error) {
            <div class="error-message">
              <ion-icon name="alert-circle" class="error-icon"></ion-icon>
              <span>{{ error }}</span>
            </div>
          }
        </div>
        
        <!-- Password Input -->
        <div class="input-group">
          <ion-input 
            type="password" 
            formControlName="password"
            [placeholder]="'auth.password' | translate"
            fill="outline"
            class="modern-input"
            [class.ion-invalid]="signinForm.get('password')?.invalid && formSubmitted()">
          </ion-input>
          @if (passwordError(); as error) {
            <div class="error-message">
              <ion-icon name="alert-circle" class="error-icon"></ion-icon>
              <span>{{ error }}</span>
            </div>
          }
        </div>

        <!-- Forgot Password -->
        <div class="forgot-link-row">
          <button type="button" class="btn-text forgot-link" (click)="goToForgotPassword()">{{ 'auth.forgotPassword' | translate }}</button>
        </div>

        <!-- Sign In Button -->
        <button
          type="submit"
          class="btn-primary btn-block signin-btn"
          [disabled]="isLoading() || !signinForm.valid">
          @if (isLoading()) {
            <ion-spinner name="dots"></ion-spinner>
          } @else {
            <span>{{ 'auth.signInButton' | translate }}</span>
          }
        </button>
      </form>

      <!-- Footer with Social Login -->
      <app-auth-footer mode="signin"></app-auth-footer>
    </div>
  </div>

  <!-- Toast for messages -->
  <ion-toast
    [isOpen]="showToast()"
    [message]="toastMessage()"
    [color]="toastColor()"
    duration="3000"
    position="top"
    (didDismiss)="onToastDismiss()">
  </ion-toast>
</div>
