<div class="verify-email-page auth-background">
  <button class="btn-icon back-btn" (click)="goToSignIn()">
    <ion-icon name="arrow-back"></ion-icon>
  </button>

  <div class="branding-section">
    <app-auth-branding></app-auth-branding>
  </div>

  <div class="form-section">
    <div class="form-container">
      <div class="form-header">
        <div class="icon-wrapper">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <h1>{{ 'auth.verifyEmailTitle' | translate }}</h1>
        <p>{{ 'auth.verifyEmailSubtitle' | translate: { email: email() } }}</p>
      </div>

      <form [formGroup]="verificationForm" (ngSubmit)="verify()" class="verify-form">
        <div class="input-group">
          <ion-input
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            formControlName="code"
            [placeholder]="'auth.verificationCodePlaceholder' | translate"
            fill="outline"
            class="code-input"
            [class.ion-invalid]="codeInvalid()"
            (ionInput)="normalizeCode($event)">
          </ion-input>
          @if (codeInvalid()) {
            <div class="error-message">
              <ion-icon name="alert-circle" class="error-icon"></ion-icon>
              <span>{{ 'auth.verificationCodeValidation' | translate }}</span>
            </div>
          }
        </div>

        <button type="submit" class="btn-primary btn-block auth-btn" [disabled]="isLoading()">
          @if (isLoading()) {
            <ion-spinner name="dots"></ion-spinner>
          } @else {
            {{ 'auth.verifyEmailButton' | translate }}
          }
        </button>
      </form>

      <button type="button" class="resend-button" [disabled]="isLoading()" (click)="resend()">
        {{ 'auth.resendVerificationCode' | translate }}
      </button>
    </div>
  </div>
</div>
