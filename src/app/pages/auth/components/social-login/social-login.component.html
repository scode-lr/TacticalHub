<div class="social-section">
  <div class="divider-line">
    <span class="divider-text">{{ 'auth.or' | translate }}</span>
  </div>

  <div class="social-buttons">
    <button
      class="btn-secondary btn-block"
      (click)="onGoogleClick()"
      [disabled]="isLoading">
      @if (isProviderLoading('google')) {
        <ion-spinner name="dots"></ion-spinner>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"></path>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"></path>
          <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"></path>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"></path>
        </svg>
        <span>{{ 'auth.continueWithGoogle' | translate }}</span>
      }
    </button>

    <button
      class="btn-secondary btn-block"
      (click)="onAppleClick()"
      [disabled]="isLoading">
      @if (isProviderLoading('apple')) {
        <ion-spinner name="dots"></ion-spinner>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.42 2.2-1.12 3.02-.85.98-2.24 1.74-3.4 1.65-.14-1.1.42-2.28 1.1-3.02.77-.86 2.15-1.5 3.42-1.65zM20.9 17.1c-.6 1.38-.9 2-1.67 3.22-1.08 1.7-2.6 3.82-4.48 3.83-1.67.02-2.1-1.1-4.37-1.08-2.27.01-2.74 1.1-4.4 1.1-1.88.01-3.32-1.9-4.4-3.6C-1.2 16.9-1.6 10.8 1.4 7.6 2.7 6.13 4.55 5.2 6.4 5.2c1.9 0 3.1 1.1 4.68 1.1 1.53 0 2.46-1.1 4.68-1.1 1.65 0 3.4.9 4.65 2.45-4.08 2.24-3.42 8.06.5 9.35z"></path></svg>
        <span>{{ 'auth.continueWithApple' | translate }}</span>
      }
    </button>
  </div>
</div>
