<div class="page-container">
  <div class="section-header-with-back-button">
    <app-back-button [route]="backRoute()" />
    <h1 class="section-title">{{ 'admin.forms.submissionDetail.title' | translate }}</h1>
  </div>

  @if (loading()) {
    <div class="loading-state"></div>
  }

  @if (!loading() && submission(); as detail) {
    <app-submission-detail-view
      [submission]="detail"
      [reviewMode]="detail.status === AppStatus.Pending"
      (fieldStatesChange)="onFieldStatesChange($event)"
    />

    @if (detail.status === AppStatus.Pending) {
      <div class="review-comment">
        <label class="review-comment-label">{{ 'notifications.reviewComment' | translate }}</label>
        <textarea
          class="review-comment-input"
          rows="3"
          [placeholder]="'notifications.reviewCommentPlaceholder' | translate"
          [(ngModel)]="comment"
        ></textarea>
      </div>

      <div class="review-actions">
        <button type="button" class="btn-secondary" [disabled]="isReviewing()" (click)="reject()">
          {{ 'common.reject' | translate }}
        </button>
        <button type="button" class="btn-primary" [disabled]="isReviewing()" (click)="approve()">
          {{ 'common.approve' | translate }}
        </button>
      </div>
    }

    <!-- Deferred: the document is a side artifact, so its chunk and its lookup must never hold
         up the answers. The placeholder keeps the same footprint to avoid a layout jump. -->
    @defer (on immediate) {
      <app-submission-document [submissionId]="detail.id" />
    } @placeholder {
      <div class="document-placeholder"></div>
    }
  }

  <ion-toast
    [isOpen]="toastVisible()"
    [message]="toastMessage()"
    [color]="toastColor()"
    duration="3000"
    position="top"
    (didDismiss)="onToastDismiss()">
  </ion-toast>
</div>
