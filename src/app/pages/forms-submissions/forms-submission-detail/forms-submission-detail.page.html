<div class="page-container">
  <div class="section-header-with-back-button">
    <app-back-button [route]="backRoute()" />
    <h1 class="section-title">{{ 'admin.forms.submissionDetail.title' | translate }}</h1>
  </div>

  @if (loading()) {
    <div class="loading-state"></div>
  }

  @if (!loading() && submission(); as detail) {
    <app-submission-detail-view [submission]="detail" />

    <!-- Deferred: the document is a side artifact, so its chunk and its lookup must never hold
         up the answers. The placeholder keeps the same footprint to avoid a layout jump. -->
    @defer (on immediate) {
      <app-submission-document [submissionId]="detail.id" />
    } @placeholder {
      <div class="document-placeholder"></div>
    }
  }
</div>
