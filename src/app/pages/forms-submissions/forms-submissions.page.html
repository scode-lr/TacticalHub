<div class="page-container">
<app-pull-to-refresh (refresh)="onRefresh($event)">
  <div class="section-header">
    <div class="header-content">
      <h1 class="section-title">{{ 'admin.menu.forms' | translate }}</h1>
      <p class="section-subtitle">{{ 'admin.description.forms' | translate }}</p>
    </div>
  </div>

  <div class="tab-switch forms-submissions-tabs">
    <button type="button" class="tab-switch-btn" [class.active]="activeTab() === 'submissions'" (click)="setTab('submissions')">
      {{ 'admin.forms.tabs.submissions' | translate }}
    </button>
    <button type="button" class="tab-switch-btn" [class.active]="activeTab() === 'sync'" (click)="setTab('sync')">
      {{ 'admin.forms.tabs.sync' | translate }}
    </button>
  </div>

  <app-club-submissions-list [hidden]="activeTab() !== 'submissions'" />

  @if (visitedSync()) {
    <app-forms-sync-list [hidden]="activeTab() !== 'sync'" />
  }
</app-pull-to-refresh>
</div>
