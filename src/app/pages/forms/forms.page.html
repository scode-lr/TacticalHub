<div class="page-container">
<app-pull-to-refresh (refresh)="onRefresh($event)">
  <div class="section-header">
    <h1 class="section-title">{{ 'user.menu.forms' | translate }}</h1>
  </div>

  @if (loading()) {
  <div class="forms-grid">
    <div class="skeleton-card">
      <div class="skeleton-card-header">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-subtitle"></div>
      </div>
      <div class="skeleton-card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line skeleton-line--short"></div>
      </div>
      <div class="skeleton-card-footer">
        <div class="skeleton-line skeleton-badge"></div>
      </div>
    </div>
  </div>
  } @else if (rows().length === 0) {
  <div class="empty-state">
    <div class="empty-icon-wrap">
      <ion-icon name="document-text-outline"></ion-icon>
    </div>
    <h3 class="empty-title">{{ 'user.action.noForms' | translate }}</h3>
    <p class="empty-description">
      {{ 'user.action.noFormsDescription' | translate }}
    </p>
  </div>
  } @else {
  <div class="forms-groups">
    @for (group of formGroups(); track group.action) {
      <app-forms-group-section [icon]="group.icon" [titleKey]="group.titleKey" [count]="group.rows.length">
        @for (row of group.rows; track row.form.id) {
        <app-form-header
          [form]="row.form"
          [editable]="false"
          [formOpen]="row.isOpen"
          [mySubmissionStatus]="row.mySubmissionStatus"
          [mySubmissionLoading]="row.mySubmissionLoading"
        />
        }
      </app-forms-group-section>
    }
  </div>
  }
</app-pull-to-refresh>
</div>
