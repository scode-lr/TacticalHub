<div class="mobile-page-header">
  <app-user-header [showBackButton]="true" [title]="'admin.settings.title'" [backRoute]="backRoute()" />
</div>

<div class="page-container">
  <div class="section-header-with-back-button">
    <app-back-button [route]="backRoute()" />
    <h1 class="section-title">{{ 'admin.settings.title' | translate }}</h1>
  </div>

  <div class="settings-cards">
    <app-action-row
      icon="information-circle-outline"
      [label]="'admin.settings.information.title' | translate"
      [description]="'admin.settings.information.description' | translate"
      (activated)="goToInformation()" />

    <app-action-row
      icon="document-text-outline"
      [label]="'admin.settings.forms.title' | translate"
      [description]="'admin.settings.forms.description' | translate"
      (activated)="goToForms()" />

    <app-action-row
      icon="wallet-outline"
      [label]="'admin.settings.sponsors.title' | translate"
      [description]="'admin.settings.sponsors.description' | translate"
      (activated)="goToSponsors()" />
  </div>
</div>
